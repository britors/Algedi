[workspace]
resolver = "2"
members = [
    "crates/algedid",
    "crates/algedi-core",
    "crates/algedi-provider-trait",
    "crates/algedi-provider-gdrive",
    "crates/algedi-provider-onedrive",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lyra OS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/britors/Algedi"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
zbus = "4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
oauth2 = "4"
tiny_http = "0.12"
